<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>test</title>
  <link rel="stylesheet" href="./index.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hubot+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet" />
  <script src="https://pulgasari.github.io/aufbau/importmap.js"></script>
</head>

<body class="mobilefix">

	<main>
		<h2>aufbau-button</h2>
		<aufbau-button icon='bx:search'>search</aufbau-button>

		<h2>aufbau-code</h2>
		<aufbau-code lang="javascript">
		const greet = (name) => `Hello, ${name}!`;
		console.log(greet('aufbau'));
		</aufbau-code>
		<aufbau-code lang="css" code="body { margin: 0; background: #000; }" no-copy></aufbau-code>

		<h2>aufbau-flag</h2>
		<aufbau-flag></aufbau-flag>
		<aufbau-flag code="de" variant="circle"></aufbau-flag>
		<aufbau-flag code="us"></aufbau-flag>
		
		<h2>aufbau-icon</h2>
		<aufbau-icon icon='bx:search'></aufbau-icon>

		<h2>aufbau-input</h2>
		<aufbau-input type='color'  value='#880088'></aufbau-input>
		<aufbau-input type='number' placeholder='nr...'></aufbau-input>
		<aufbau-input type='text'   placeholder='text...'></aufbau-input>
		
		<aufbau-input name="mail" type="email" placeholder="Enter your email"></aufbau-input>
		<aufbau-input name="size"  type="number" look="stepper" min="8" max="64" step="2"></aufbau-input>
		<aufbau-input name="brand" type="color"  look="swatch" value="#3355ff"></aufbau-input>

		<h2>aufbau-slider</h2>
		<aufbau-slider min=0 max=100  step=1></aufbau-slider>
		<aufbau-slider min=0 max=1000 step=1></aufbau-slider>

		<h2>aufbau-toggle</h2>
		<aufbau-toggle></aufbau-toggle>
		<aufbau-toggle look='checkbox'></aufbau-toggle>
	</main>

  <script type="module">
    import { autoloader } from '@aufbau/elements';
    autoloader();
  </script>

</body>
</html>
