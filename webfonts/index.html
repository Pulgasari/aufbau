<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aufbau webfonts</title>
  <script src="https://code.pulgasari.dev/importmap.js"></script>
  <link rel="stylesheet" href="./../css/themes/zombie.css" />
  <style>
    /* @aufbau/webfonts/index.css
       theme comes from ../css/themes/zombie.css (--aufbau-bg, --aufbau-fg, --aufbau-purple, ...)
       surfaces are derived via color-mix so the page follows any theme swap. */
    
    :root {
      --surface : color-mix(in oklab, var(--aufbau-bg) 88%, var(--aufbau-fg));
      --line    : color-mix(in oklab, var(--aufbau-bg) 78%, var(--aufbau-fg));
      --muted   : color-mix(in oklab, var(--aufbau-fg) 55%, var(--aufbau-bg));
      --accent  : var(--aufbau-purple);
      --rail    : 3.5rem;
      --ui      : system-ui, sans-serif;
    }
    
    body {
      margin      : 0;
      padding     : 1rem 1rem calc(var(--rail) + 1rem);
      background  : var(--aufbau-bg);
      color       : var(--aufbau-fg);
      font-family : var(--ui);
      line-height : 1.5;
    }

/* :::::: masthead ::::::::::::::::::::::::::::::::::::::::::: */

.masthead { margin-bottom: 1rem; }
.masthead h1 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
.masthead p  { margin: 0; color: var(--muted); font-size: 0.85rem; }

/* :::::: toolbar :::::::::::::::::::::::::::::::::::::::::::: */

.toolbar {
  position         : sticky;
  top              : 0;
  z-index          : 2;
  display          : flex;
  flex-direction   : column;
  gap              : 0.75rem;
  padding          : 0.75rem 0;
  background       : var(--aufbau-bg);
  border-bottom    : 1px solid var(--line);
}

.search {
  width         : 100%;
  padding       : 0.6rem 0.8rem;
  border        : 1px solid var(--line);
  border-radius : 0.5rem;
  background    : var(--surface);
  color         : inherit;
  font          : inherit;
}

.chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }

.chips button {
  padding       : 0.3rem 0.7rem;
  border        : 1px solid var(--line);
  border-radius : 999px;
  background    : transparent;
  color         : var(--muted);
  font          : inherit;
  font-size     : 0.8rem;
  cursor        : pointer;
}

.chips button[aria-pressed="true"] {
  border-color : var(--accent);
  color        : var(--accent);
}

.controls {
  display     : flex;
  flex-wrap   : wrap;
  align-items : center;
  gap         : 0.75rem 1.25rem;
}

.controls label {
  display     : flex;
  align-items : center;
  gap         : 0.5rem;
  font-size   : 0.8rem;
  color       : var(--muted);
}

.controls input[type="range"] { width: 8rem; accent-color: var(--accent); }
.controls output { min-width: 3.2rem; font-variant-numeric: tabular-nums; }

/* :::::: letterbar :::::::::::::::::::::::::::::::::::::::::::
   mobile: fixed rail at the bottom, thumb reachable.
   desktop: sticky column on the left (see media query). */

.letterbar {
  position       : fixed;
  inset          : auto 0 0 0;
  z-index        : 3;
  display        : flex;
  gap            : 0.15rem;
  height         : var(--rail);
  align-items    : center;
  padding        : 0 0.75rem;
  overflow-x     : auto;
  background     : var(--surface);
  border-top     : 1px solid var(--line);
  scrollbar-width: none;
}

.letterbar a {
  flex           : 0 0 auto;
  min-width      : 2rem;
  padding        : 0.4rem 0;
  border-radius  : 0.4rem;
  color          : var(--muted);
  text-align     : center;
  text-decoration: none;
  font-size      : 0.85rem;
}

.letterbar a:hover,
.letterbar a:focus-visible { color: var(--accent); background: var(--aufbau-bg); }

/* :::::: sections ::::::::::::::::::::::::::::::::::::::::::: */

main section { margin-top: 1.5rem; }

main h2 {
  margin           : 0 0 0.6rem;
  padding-bottom   : 0.2rem;
  border-bottom    : 1px solid var(--line);
  color            : var(--muted);
  font-size        : 0.8rem;
  font-weight      : 600;
  letter-spacing   : 0.2em;
  text-transform   : uppercase;
  scroll-margin-top: 9rem; /* clears the sticky toolbar on anchor jumps */
}

/* :::::: specimen ::::::::::::::::::::::::::::::::::::::::::: */

.specimen {
  display       : block;
  padding       : 0.9rem 1rem;
  border        : 1px solid var(--line);
  border-radius : 0.6rem;
  background    : var(--surface);
  overflow      : hidden;
}

.specimen header {
  display     : flex;
  flex-wrap   : wrap;
  align-items : baseline;
  gap         : 0.5rem;
}

.specimen h3 { margin: 0; font-size: 0.9rem; font-weight: 600; }

.specimen header p {
  display   : flex;
  gap       : 0.5rem;
  margin    : 0;
  color     : var(--muted);
  font-size : 0.72rem;
}

.specimen .cat     { color: var(--accent); }
.specimen .license { font-variant-numeric: tabular-nums; }

.preview {
  margin      : 0.6rem 0 0;
  line-height : 1.25;
  overflow-wrap: anywhere;
  /* fallback face is visible until the real one arrives, then it swaps in */
  transition  : opacity 0.15s;
}

.specimen[data-state="idle"]    .preview,
.specimen[data-state="loading"] .preview { opacity: 0.45; }
.specimen[data-state="error"]   .preview { opacity: 0.3; }

.hint  { margin: 0.4rem 0 0; color: var(--aufbau-red); font-size: 0.72rem; }
.state { color: var(--muted); }

/* list mode keeps one specimen per row, so the single line stays comparable */
main[data-viewmode="list"] .preview { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* :::::: aufbau-index fallback :::::::::::::::::::::::::::::::
   these rules also apply when <aufbau-index> is not registered yet,
   because they target the attribute rather than the upgraded element. */

aufbau-index {
  display : grid;
  gap     : var(--aufbau-gap, 1rem);
  width   : 100%;
}

aufbau-index[viewmode="list"] { grid-template-columns: 1fr; }

aufbau-index[viewmode="grid"] {
  /* no masonry: native grid-lanes is not interoperable yet and the column hack
     breaks reading order, which an alphabetical list cannot afford */
  grid-template-columns: repeat(auto-fill, minmax(var(--aufbau-item-size, 320px), 1fr));
  align-items          : start;
}

/* :::::: desktop :::::::::::::::::::::::::::::::::::::::::::: */

@media (min-width: 48rem) {
  body {
    display               : grid;
    grid-template-columns : var(--rail) 1fr;
    grid-template-areas   : 'rail content';
    gap                   : 0 1.5rem;
    padding               : 1.5rem 2rem;
  }

  .masthead, .toolbar, main { grid-column: 2; }

  .letterbar {
    position       : sticky;
    inset          : auto;
    top            : 1.5rem;
    grid-area      : rail;
    flex-direction : column;
    height         : auto;
    max-height     : calc(100vh - 3rem);
    overflow-y     : auto;
    padding        : 0.5rem 0;
    border         : 1px solid var(--line);
    border-radius  : 0.6rem;
  }
}

/* :::::: a11y ::::::::::::::::::::::::::::::::::::::::::::::: */

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
html { scroll-behavior: smooth; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
  }
  </style>
</head>

<body>

<div id="app"></div>

<script type="module">
import aufbau, { dom, html, preact } from '@aufbau/kits/preact-htm';
const { computed, render, signal, useEffect, useRef, useState } = preact;
await aufbau.init();

// :::::: CONFIG ::::::::::::::::::::::::::::::::::::::::::::::::

const MANIFEST = new URL('./data.js', import.meta.url);

// pangram exercises umlauts and eszett - relevant for the german/blackletter part of the collection
const SPECIMEN_LINE  = 'Victor jagt zwölf Boxkämpfer quer über den großen Sylter Deich.';
const SPECIMEN_BLOCK = 'Der Buchdruck kam aus Mainz, die Schwabacher aus Nürnberg, und beide '
                     + 'überlebten fünfhundert Jahre Papier. 0123456789 – ÄÖÜ äöüß & @ %';

const CATEGORIES = ['all', 'sans', 'serif', 'mono', 'display', 'handwriting'];

// :::::: STATE :::::::::::::::::::::::::::::::::::::::::::::::::

const fonts    = signal([]);
const status   = signal('loading'); // loading | ready | error
const query    = signal('');
const category = signal('all');
const viewmode = signal('list');    // list | grid
const size     = signal(34);
const weight   = signal(400);

// :::::: DERIVED :::::::::::::::::::::::::::::::::::::::::::::::

const filtered = computed(() => {
  const q = query.value.trim().toLowerCase();
  const c = category.value;
  return fonts.value.filter(font =>
    (c === 'all' || font.category === c) &&
    (!q || font.name.toLowerCase().includes(q) || font.designer.toLowerCase().includes(q))
  );
});

// [['A', [...fonts]], ['B', [...]]] - sorted, locale aware
const groups = computed(() => {
  const map = new Map();
  for (const font of [...filtered.value].sort((a, b) => a.name.localeCompare(b.name, 'de'))) {
    const letter = font.name[0].toUpperCase();
    if (!map.has(letter)) map.set(letter, []);
    map.get(letter).push(font);
  }
  return [...map];
});

// :::::: FONT LOADING ::::::::::::::::::::::::::::::::::::::::::

const registry = new Map(); // font.id -> Promise, prevents duplicate FontFace registration

// css font `format()` hint by file extension; unknown extensions omit the hint
const FONT_FORMATS = { otf: 'opentype', ttf: 'truetype', woff: 'woff', woff2: 'woff2' };
const faceSource = (file) => {
  // face.file is repo-relative (resolved against data.js) or an absolute url
  const url    = new URL(file, MANIFEST).href;
  const format = FONT_FORMATS[file.split('.').pop().toLowerCase()];
  return format ? `url("${url}") format("${format}")` : `url("${url}")`;
};

/**
 * loads every face of a font via the FontFace api and registers it on the document.
 * @param {object} font - manifest entry
 * @returns {Promise<void>}
 */
function loadFont (font) {
  if (registry.has(font.id)) return registry.get(font.id);

  const task = Promise.all(font.faces.map(async face => {
    // weight may be a variable range like "100 800", which the descriptor accepts
    const loaded = await new FontFace(font.name, faceSource(face.file), {
      weight  : String(face.weight),
      style   : face.style,
      display : 'swap'
    }).load();
    document.fonts.add(loaded);
  })).catch(err => {
    console.warn(`[@aufbau/webfonts] could not load "${font.name}":`, err);
    throw err;
  });

  registry.set(font.id, task);
  return task;
}

// :::::: COMPONENTS ::::::::::::::::::::::::::::::::::::::::::::

/**
 * single specimen. the face is only fetched once the card is about to enter the viewport,
 * so a collection of 100+ fonts stays cheap on mobile.
 */
function Specimen ({ font }) {
  const ref = useRef(null);
  const [state, setState] = useState(registry.has(font.id) ? 'ready' : 'idle');

  useEffect(() => {
    if (state !== 'idle' || !ref.current) return;

    const observer = new IntersectionObserver(([entry]) => {
      if (!entry.isIntersecting) return;
      observer.disconnect();
      setState('loading');
      loadFont(font).then(() => setState('ready'), () => setState('error'));
    }, { rootMargin: '300px' });

    observer.observe(ref.current);
    return () => observer.disconnect();
  }, [font.id, state]);

  // weight is clamped to what the font actually offers, so the control never lies
  const available = font.faces.flatMap(face =>
    String(face.weight).includes(' ')
      ? String(face.weight).split(' ').map(Number)
      : [Number(face.weight)]
  );
  const min      = Math.min(...available);
  const max      = Math.max(...available);
  const rendered = Math.min(Math.max(weight.value, min), max);

  const style = {
    fontFamily : `"${font.name}", ${font.fallback}`,
    fontSize   : `${size.value}px`,
    fontWeight : rendered
  };

  return html`
    <aufbau-item ref=${ref} class="specimen" data-state=${state}>
      <header>
        <h3>${font.name}</h3>
        <p>
          <span class="cat">${font.category}</span>
          <span class="designer">${font.designer}</span>
          <span class="license" title=${font.commercial ? 'commercial use allowed' : 'private use only'}>
            ${font.license}
          </span>
        </p>
      </header>
      <p class="preview" style=${style}>
        ${viewmode.value === 'list' ? SPECIMEN_LINE : SPECIMEN_BLOCK}
      </p>
      ${state === 'error' && html`<p class="hint">Datei fehlt: ${font.faces[0].file}</p>`}
    </aufbau-item>
  `;
}

/** a-z jumplist. only letters that actually have matches are shown. */
function Letterbar () {
  return html`
    <nav class="letterbar" aria-label="Alphabet">
      ${groups.value.map(([letter]) => html`
        <a key=${letter} href=${`#letter-${letter}`}>${letter}</a>
      `)}
    </nav>
  `;
}

function Toolbar () {
  return html`
    <div class="toolbar">
      <input
        type="search"
        class="search"
        placeholder="Schrift oder Gestalter suchen"
        value=${query.value}
        onInput=${event => query.value = event.target.value} />

      <div class="chips" role="group" aria-label="Kategorie">
        ${CATEGORIES.map(cat => html`
          <button
            key=${cat}
            aria-pressed=${category.value === cat}
            onClick=${() => category.value = cat}>${cat}</button>
        `)}
      </div>

      <div class="controls">
        <label>
          <span>Größe</span>
          <input type="range" min="12" max="120" value=${size.value}
            onInput=${event => size.value = +event.target.value} />
          <output>${size.value}px</output>
        </label>
        <label>
          <span>Schnitt</span>
          <input type="range" min="100" max="900" step="100" value=${weight.value}
            onInput=${event => weight.value = +event.target.value} />
          <output>${weight.value}</output>
        </label>
        <div class="chips" role="group" aria-label="Ansicht">
          <button aria-pressed=${viewmode.value === 'list'} onClick=${() => viewmode.value = 'list'}>Liste</button>
          <button aria-pressed=${viewmode.value === 'grid'} onClick=${() => viewmode.value = 'grid'}>Raster</button>
        </div>
      </div>
    </div>
  `;
}

function App () {
  if (status.value === 'loading') return html`<p class="state">Sammlung wird geladen…</p>`;
  if (status.value === 'error')   return html`<p class="state">data.js ist nicht erreichbar.</p>`;

  return html`
    <header class="masthead">
      <h1>@aufbau/webfonts</h1>
      <p>${filtered.value.length} von ${fonts.value.length} Schriften</p>
    </header>

    ${Toolbar()}
    ${Letterbar()}

    <main data-viewmode=${viewmode.value}>
      ${groups.value.length === 0
        ? html`<p class="state">Keine Treffer. Suche oder Kategorie zurücksetzen.</p>`
        : groups.value.map(([letter, list]) => html`
            <section key=${letter}>
              <h2 id=${`letter-${letter}`}>${letter}</h2>
              <aufbau-index viewmode=${viewmode.value} item-size="320px" gap="1rem">
                ${list.map(font => html`<${Specimen} key=${font.id} font=${font} />`)}
              </aufbau-index>
            </section>
          `)}
    </main>
  `;
}

// :::::: BOOT ::::::::::::::::::::::::::::::::::::::::::::::::::

try {
  const data = await import(MANIFEST.href);
  fonts.value  = data.fonts ?? [];
  status.value = 'ready';
} catch (err) {
  console.error('[@aufbau/webfonts] manifest failed:', err);
  status.value = 'error';
}

render(html`<${App} />`, document.querySelector('#app'));
</script>

</body>
</html>
