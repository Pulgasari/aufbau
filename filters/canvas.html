<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://code.pulgasari.dev/importmap.js"></script>
  <title>@aufbau/filters · canvas</title>
  <link rel="stylesheet" href="https://code.pulgasari.dev/aufbau/css/aufbau.css"/>
</head>
<body>
  <aside>
    <h1><aufbau-icon icon="lucide:layers"></aufbau-icon> @aufbau/filters</h1>
    <p>every filter on a &lt;canvas&gt; via filterCanvas — imageData where the filter has
      it, the ctx.filter bridge for css/svg, or the webgl backend.<br/>
      <a href="index.html">← dom</a> · <a href="editor.html">editor →</a></p>
    <nav id="nav"></nav>
  </aside>

  <main>
    <div class="stage"><canvas id="stage" width="760" height="300"></canvas></div>
    <h2 id="title"></h2>
    <div class="controls" id="controls"></div>
    <div class="panels">
      <p id="backend"></p>
      <aufbau-code id="js" lang="js"></aufbau-code>
    </div>
  </main>

  <script type="module">
    import { list, filterCanvas } from './index.js';
    import aufbau, { dom } from '@aufbau/runtime';

    await aufbau.init({ mode: 'auto' });

    const $nav      = dom.element('#nav');
    const $title    = dom.element('#title');
    const $controls = dom.element('#controls');
    const $backend  = dom.element('#backend');
    const $js       = dom.element('#js');
    const canvas    = dom.getElement('#stage');
    const ctx       = canvas.getContext('2d', { willReadFrequently: true });

    // load the aufbau logo once, recoloured white, as an <img> we can draw onto the canvas.
    // going through aufbau.import (string) → data-uri keeps the canvas untainted, so the
    // imageData filters can still read pixels back.
    let logo = null;
    try {
      const svg = (await aufbau.import('https://code.pulgasari.dev/aufbau/logo.svg', { as: 'string' }))
        .replace(/currentcolor/gi, '#ffffff');
      logo = new Image();
      logo.src = 'data:image/svg+xml,' + encodeURIComponent(svg);
      await logo.decode();
    } catch { logo = null; }

    const catalogue = list(); // every filter is canvas-capable (imageData, bridge or webgl)
    let current = catalogue[0];
    let options = {};

    // a busy scene: gradient, discs, stripes and the logo — enough high-frequency detail
    // that pixelate/dither/dot-screen read clearly.
    function drawScene () {
      const { width: w, height: h } = canvas;
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#3b2fd6'); grad.addColorStop(0.5, '#c026a3'); grad.addColorStop(1, '#0fb8a0');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
      for (const [x, y, r, c] of [[140, 90, 60, '#ffd166'], [620, 210, 80, '#ef476f'], [430, 70, 40, '#06d6a0']]) {
        ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
      for (let x = 0; x < w; x += 18) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 40, h); ctx.stroke(); }
      if (logo) {
        const lw = Math.min(560, w * 0.72), lh = lw * logo.height / logo.width;
        ctx.drawImage(logo, (w - lw) / 2, (h - lh) / 2, lw, lh);
      } else {
        ctx.fillStyle = '#fff'; ctx.font = '800 120px ui-monospace, monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('aufbau', w / 2, h / 2 + 6);
      }
    }

    for (const f of catalogue) {
      dom.createElement('button', {
        appendTo    : $nav.node,
        data        : { id: f.id },
        onclick     : () => select(f),
        textContent : f.name,
      });
    }

    function select (f) {
      current = f;
      options = {};
      for (const [key, spec] of Object.entries(f.vars)) options[key] = spec.default;
      for (const button of $nav.node.children) {
        button.setAttribute('aria-current', String(button.dataset.id === f.id));
      }
      buildControls();
      render();
    }

    function buildControls () {
      $title.setText(`${current.name}  ·  ${current.id}`);
      $controls.node.replaceChildren(aufbau.gui.controls(current.vars, {
        values   : options,
        onChange : values => { options = values; render(); },
      }));
    }

    function render () {
      drawScene();
      try { filterCanvas(canvas, current.id, options); }
      catch (e) { $backend.setText(String(e.message)); return; }

      const b = current.backends;
      $backend.setText(
        b.webgl              ? 'webgl — fragment shader on the gpu (svg/canvas cannot do it).'
        : (!b.svg && !b.css) ? 'imageData — the filter walks the pixels directly.'
        : b.css              ? 'bridge — ctx.filter = css string.'
        :                      'bridge — ctx.filter = url(#baked-svg-filter).');
      const opts = JSON.stringify(options, null, 2).replace(/"([^"]+)":/g, '$1:');
      $js.setAttr('code',
        `import { filterCanvas } from '@aufbau/filters';\n\n` +
        `filterCanvas(canvas, '${current.id}', ${opts});`);
    }

    select(current);
  </script>
</body>
</html>
