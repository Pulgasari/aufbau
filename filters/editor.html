<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://code.pulgasari.dev/importmap.js"></script>
  <title>@aufbau/filters · editor</title>
  <link rel="stylesheet" href="https://code.pulgasari.dev/aufbau/css/aufbau.css"/>
</head>
<body>
  <aside>
    <h1><aufbau-icon icon="lucide:wand-2"></aufbau-icon> add filter</h1>
    <p>a non-destructive stack — every stage runs through the pipeline over one source.
      <br/><a href="canvas.html">← canvas</a> · <a href="index.html">dom</a></p>
    <nav id="palette"></nav>
  </aside>

  <main>
    <div class="preview"><canvas id="preview"></canvas></div>
    <div class="hint" id="hint"></div>
  </main>

  <div class="stack">
    <h2>pipeline</h2>
    <div id="stack"></div>
  </div>

  <script type="module">
    import { list, createPipeline } from './index.js';
    import aufbau, { dom } from '@aufbau/runtime';

    await aufbau.init({ mode: 'auto' });

    const catalogue = list();
    const byId      = Object.fromEntries(catalogue.map(f => [f.id, f]));
    const $palette  = dom.element('#palette');
    const $stack    = dom.element('#stack');
    const $hint     = dom.element('#hint');
    const preview   = dom.getElement('#preview');

    // the source scene, drawn once onto an offscreen canvas the pipeline reads from.
    const source = document.createElement('canvas');
    source.width = 760; source.height = 300;

    // load the aufbau logo (recoloured white) via aufbau.import → data-uri, so the source
    // canvas stays untainted for the imageData stages.
    let logo = null;
    try {
      const svg = (await aufbau.import('https://code.pulgasari.dev/aufbau/logo.svg', { as: 'string' }))
        .replace(/currentcolor/gi, '#ffffff');
      logo = new Image();
      logo.src = 'data:image/svg+xml,' + encodeURIComponent(svg);
      await logo.decode();
    } catch { logo = null; }

    (function drawScene () {
      const ctx = source.getContext('2d');
      const { width: w, height: h } = source;
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#3b2fd6'); grad.addColorStop(0.5, '#c026a3'); grad.addColorStop(1, '#0fb8a0');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
      for (const [x, y, r, c] of [[140, 90, 60, '#ffd166'], [620, 210, 80, '#ef476f'], [430, 70, 40, '#06d6a0']]) {
        ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
      for (let x = 0; x < w; x += 18) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 40, h); ctx.stroke(); }
      if (logo) {
        const lw = Math.min(560, w * 0.72), lh = lw * logo.height / logo.width;
        ctx.drawImage(logo, (w - lw) / 2, (h - lh) / 2, lw, lh);
      } else {
        ctx.fillStyle = '#fff'; ctx.font = '800 120px ui-monospace, monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('aufbau', w / 2, h / 2 + 6);
      }
    })();

    const pipe = createPipeline(source);

    const backendOf = f => {
      const b = f.backends;
      return b.webgl ? 'webgl' : (!b.svg && !b.css) ? 'imageData' : 'bridge';
    };
    const defaults = f => Object.fromEntries(Object.entries(f.vars).map(([k, s]) => [k, s.default]));

    for (const f of catalogue) {
      dom.createElement('button', {
        appendTo    : $palette.node,
        onclick     : () => { pipe.add(f.id, defaults(f)); rebuild(); },
        textContent : f.name,
      });
    }

    async function render () {
      await pipe.render(preview);
      $hint.setText(pipe.stages.length
        ? `${pipe.stages.filter(s => s.enabled).length} active stage(s) · source is never mutated — reorder/toggle/tweak re-runs the whole stack`
        : 'empty pipeline — add a filter from the left. stages of any backend mix freely.');
    }

    function rebuild () {
      $stack.empty();
      if (pipe.stages.length === 0) {
        dom.createElement('div', { class: 'empty', textContent: 'no stages yet.', appendTo: $stack.node });
      }
      pipe.stages.forEach((stage, index) => {
        const f    = byId[stage.id];
        const card = dom.createElement('div', { class: 'card' + (stage.enabled ? '' : ' off'), appendTo: $stack.node });
        const head = document.createElement('header');
        head.innerHTML =
          `<input type="checkbox" ${stage.enabled ? 'checked' : ''}/>` +
          `<span class="name">${f.name}</span><span class="badge">${backendOf(f)}</span>` +
          `<button data-a="up">↑</button><button data-a="down">↓</button><button data-a="rm">✕</button>`;
        head.querySelector('input').onchange = e => { pipe.toggle(index, e.target.checked); rebuild(); };
        head.querySelector('[data-a="up"]').onclick   = () => { if (index > 0) { pipe.move(index, index - 1); rebuild(); } };
        head.querySelector('[data-a="down"]').onclick = () => { if (index < pipe.stages.length - 1) { pipe.move(index, index + 1); rebuild(); } };
        head.querySelector('[data-a="rm"]').onclick   = () => { pipe.remove(index); rebuild(); };
        card.appendChild(head);

        // per-stage controls, built from the filter's vars by aufbau.gui.
        card.appendChild(aufbau.gui.controls(f.vars, {
          values   : stage.options,
          onChange : values => { pipe.set(index, values); render(); },
        }));
      });
      render();
    }

    // seed a demo stack so the page shows something immediately.
    pipe.add('levels', { black: 0.05, white: 0.95, gamma: 1.1 })
        .add('bloom', { threshold: 0.6, radius: 6, strength: 1 })
        .add('kaleidoscope', { segments: 6, angle: 0 });
    rebuild();
  </script>
</body>
</html>
