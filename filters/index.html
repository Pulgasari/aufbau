<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://code.pulgasari.dev/importmap.js"></script>
  <title>@aufbau/filters</title>
  <link rel="stylesheet" href="https://code.pulgasari.dev/aufbau/css/aufbau.css"/>
  <style>
    body      { display: flex; flex-direction: column; gap: 1rem; }
    main      { display: flex; flex-direction: column; gap: 1rem; }
    #controls { display: flex; flex-direction: column; gap: 1rem; }
    
    body { padding: 1rem; }
    
    #defs { position: absolute; width: 0; height: 0; }
  </style>
  <!--
  <script type='stylescript'>
    body { flow: y; gap: true; padding: true; }
    main { flow: y; gap: true; }
  </script>
  -->
</head>
<body>
  
  <aside>
    <h1>
      <aufbau-icon icon="lucide:sparkles"></aufbau-icon>
      @aufbau/filters
    </h1>
    <p>
      filters are js functions that generate svg. pick one and tweak it live.<br/>
      <a href="canvas.html">canvas backend →</a> · <a href="editor.html">editor →</a>
    </p>
  </aside>

  <main>

    <nav id="nav"></nav>
    
    <div id='stage'><div id='subject'>aufbau</div></div>
    
    <h2 id="title"></h2>
    
    <div class='controls'></div>
    
    <div class="panels">
      <aufbau-code id="svg" lang="svg"></aufbau-code>
      <aufbau-code id="css" lang="css"></aufbau-code>
      <aufbau-code id="js"  lang="js"></aufbau-code>
    </div>
    
  </main>

  <!-- shared host the previewed <filter> lives in -->
  <svg id="defs" aria-hidden="true"></svg>

  <script type="module">
    import { list, filterSvg, filterCss } from './index.js';
    import aufbau, { dom } from '@aufbau/runtime';

    await aufbau.init({ mode: 'auto' });

    // refs (domina wrappers; .node is the raw element, .setAttr/.setHTML/.setText chain)
    const { defs, $controls, $css, $js, $nav, $subject, $svg, $title } = dom.get;
    /*
    const $nav      = dom.element('#nav');
    const $subject  = dom.element('#subject');
    const $title    = dom.element('#title');
    const $controls = dom.element('#controls');
    const $svg      = dom.element('#svg');
    const $css      = dom.element('#css');
    const $js       = dom.element('#js');
    const defs      = dom.getElement('#defs');
    */

    const logo = await aufbau.import('https://code.pulgasari.dev/aufbau/logo.svg', { as: 'string' });
    $subject.setHTML(logo);

    const catalogue = list().filter(f => f.backends.svg || f.backends.css);

    let current = catalogue[0];
    let options = {};
    let counter = 0;

    for (const filter of catalogue) {
      dom.createElement('button', {
        appendTo    : $nav.node,
        data        : { id: filter.id },
        onclick     : () => select(filter),
        textContent : filter.name,
      });
    }

    function select (filter) {
      current = filter;
      options = {};
      for (const [key, spec] of Object.entries(filter.vars)) options[key] = spec.default;
      for (const button of $nav.node.children) button.setAttribute('aria-current', String(button.dataset.id === filter.id));    
      buildControls();
      render();
    }

    function buildControls () {
      const backends = ['svg', current.backends.css && 'css'].filter(Boolean).join(' + ');
      $title.setText(`${current.name}  ·  ${current.id}  ·  ${backends}`);
      const $gui = aufbau.gui.controls (current.vars, { values: options, onChange: values => { options = values; render(); } })
      $controls.node.replaceChildren($gui);
    }

    function render () {
      const cssValue = filterCss(current.id, options); // css backend, or null

      if (cssValue) {
        $subject.node.style.filter = cssValue;         // preview through the native css backend
      } else {
        // baked, uniquely-ided <filter> so every var — live or baked — reflects instantly.
        const uid    = `preview-${current.id}-${counter++}`;
        const markup = filterSvg(current.id, { ...options, svgId: uid });
        const node   = new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${markup}</svg>`, 'image/svg+xml').querySelector('filter');
        defs.replaceChildren(node);
        $subject.node.style.filter = `url(#${uid})`;
      }

      // <aufbau-code> reads its content from the `code` attribute (setAttr re-highlights).
      //$css.attr.code = `#logo { filter: ${cssValue ?? url(#aufbau-filter-${current.id}) }; }`
      //$svg.attr.code = filterSvg(current.id, options);
      $svg.setAttr('code', filterSvg(current.id, options));
      $css.setAttr('code', cssValue
        ? `#logo { filter: ${cssValue}; }  /* css backend */`
        : `#logo { filter: url(#aufbau-filter-${current.id}); }  /* svg backend */`);
      const opts = JSON.stringify(options, null, 2).replace(/"([^"]+)":/g, '$1:');
      $js.setAttr('code',
        `import ${camel(current.id)} from '@aufbau/filters/${current.id}';\n` +
        `// or: import { applyFilter } from '@aufbau/filters';\n\n` +
        `applyFilter('#logo', '${current.id}', ${opts});`);
    }

    select(current);
  </script>
</body>
</html>
