<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://code.pulgasari.dev/importmap.js"></script>
  <title>@aufbau/filters</title>
  <link rel='stylesheet' href='https://code.pulgasari.dev/aufbau/css/aufbau.css' />
  <style>

  </style>
</head>
<body>
  <aside>
    <h1><aufbau-icon icon="lucide:sparkles"></aufbau-icon> @aufbau/filters</h1>
    <p>filters are js functions that generate svg. pick one and tweak it live.<br/>
      <a href="canvas.html">canvas backend →</a> · <a href="editor.html">editor →</a></p>
    <nav id="nav"></nav>
  </aside>

  <main>
    <div class="stage"><div class="subject" id="subject">aufbau</div></div>
    <h2 id="title"></h2>
    <div class="controls" id="controls"></div>
    <div class="panels">
      <aufbau-code id='svg' lang='svg'></aufbau-code>
      <aufbau-code id='css' lang='css'></aufbau-code>
      <aufbau-code id='js'  lang='js'></aufbau-code>
      <!--
      <div><div class="tag">generated &lt;filter&gt; (baked)</div><pre id="svg"></pre></div>
      <div><div class="tag">css usage</div><pre id="css"></pre></div>
      <div><div class="tag">js usage</div><pre id="js"></pre></div>
      -->
    </div>
  </main>

  <!-- shared host the previewed <filter> lives in -->
  <svg id="defs" aria-hidden="true" style="position:absolute;width:0;height:0"></svg>

  <script type="module">
    // the filters api is imported locally (this is the package under test); everything
    // else — dom helpers, asset import, custom elements — comes from the aufbau runtime.
    import { list, filterSvg, filterCss } from './index.js';
    import aufbau, { dom } from '@aufbau/runtime';

    await aufbau.init({ mode: 'auto' });

    // use the real aufbau logo as the preview subject; fall back to the text on failure.
    try {
      const logo = await aufbau.import('https://code.pulgasari.dev/aufbau/logo.svg', { as: 'string' });
      dom.element('#subject').setHTML(logo);
    } catch { /* keep the text fallback */ }

    // this page previews on a dom element, so only css/svg filters. canvas-only ones
    // (pixelate, dither, …) live in canvas.html.
    const catalogue = list().filter(f => f.backends.svg || f.backends.css);
    const nav     = document.getElementById('nav');
    const defs    = document.getElementById('defs');
    const subject = document.getElementById('subject');
    const els     = { title: 'title', controls: 'controls', svg: 'svg', css: 'css', js: 'js' };
    for (const key in els) els[key] = document.getElementById(els[key]);

    /*
    const // attempt 2
    $controls = dom.getElement('#controls'),
    $css      = dom.getElement('#css'),
    $defs     = dom.getElement('#defs'),
    $js       = dom.getElement('#js'),
    $nav      = dom.getElement('#nav'),
    $subject  = dom.getElement('#subject'),
    $svg      = dom.getElement('#svg'),
    $title    = dom.getElement('#title');
    */

    const // attempt 3
    $controls = dom.element('#controls'),
    $css      = dom.element('#css'),
    $defs     = dom.element('#defs'),
    $js       = dom.element('#js'),
    $nav      = dom.element('#nav'),
    $subject  = dom.element('#subject'),
    $svg      = dom.element('#svg'),
    $title    = dom.element('#title');

    // attempt 4
    //const { controls, css, defs, js, nav, subject, svg, title } = dom.get;   

    let current = catalogue[0];
    let options = {};
    let counter = 0;

    for (const filter of catalogue) {
      dom.createElement('button', {
        appendTo : nav,
        data     : { id: filter.id },
        onclick  : () => select(filter),
        text     : filter.name,
      });
      /*
      const button = document.createElement('button');
      button.textContent = filter.name;
      button.onclick     = () => select(filter);
      button.dataset.id  = filter.id;
      nav.appendChild(button);
      */
    }

    function select (filter) {
      current = filter;
      options = {};
      for (const [key, spec] of Object.entries(filter.vars)) options[key] = spec.default;
      for (const b of nav.children) b.setAttribute('aria-current', String(b.dataset.id === filter.id));
      buildControls();
      render();
    }

    function buildControls () {
      const backends = ['svg', current.backends.css && 'css'].filter(Boolean).join(' + ');
      els.title.textContent = `${current.name}  ·  ${current.id}  ·  ${backends}`;
      els.controls.replaceChildren();
      for (const [key, spec] of Object.entries(current.vars)) {
        const row = document.createElement('div');
        row.className = 'row';
        const numeric = spec.type === 'number' || spec.type === 'integer';
        if (spec.type === 'boolean') {
          row.innerHTML = `<label>${key}</label>
            <input type="checkbox" ${spec.default ? 'checked' : ''}/>
            <span class="val">${spec.default}</span>`;
          const [input, out] = [row.querySelector('input'), row.querySelector('.val')];
          input.onchange = () => { options[key] = input.checked; out.textContent = input.checked; render(); };
        } else if (numeric) {
          row.innerHTML = `<label>${key}</label>
            <input type="range" min="${spec.min}" max="${spec.max}" step="${spec.step}" value="${spec.default}"/>
            <span class="val">${spec.default}</span>`;
          const [input, out] = [row.querySelector('input'), row.querySelector('.val')];
          input.oninput = () => { options[key] = Number(input.value); out.textContent = input.value; render(); };
        } else {
          row.innerHTML = `<label>${key}</label><input type="text" value="${spec.default}"/>`;
          const input = row.querySelector('input');
          input.oninput = () => { options[key] = input.value; render(); };
        }
        els.controls.appendChild(row);
      }
    }

    function render () {
      const cssValue = filterCss (current.id, options); // css backend, or null

      if (cssValue) {
        subject.style.filter = cssValue;               // preview through the native css backend
      } else {
        // baked, uniquely-ided <filter> so every var — live or baked — reflects instantly.
        const uid    = `preview-${current.id}-${counter++}`;
        const markup = filterSvg(current.id, { ...options, svgId: uid });
        const node   = new DOMParser().parseFromString(
          `<svg xmlns="http://www.w3.org/2000/svg">${markup}</svg>`, 'image/svg+xml'
        ).querySelector('filter');
        defs.replaceChildren(node);
        subject.style.filter = `url(#${uid})`;
      }

      els.svg.textContent = filterSvg(current.id, options);
      els.css.textContent = cssValue
        ? `#logo { filter: ${cssValue}; }  /* css backend */`
        : `#logo { filter: url(#aufbau-filter-${current.id}); }  /* svg backend */`;
      const opts = JSON.stringify(options, null, 2).replace(/"([^"]+)":/g, '$1:');
      $js.update('');
      els.js.textContent =
        `import ${camel(current.id)} from '@aufbau/filters/${current.id}';\n` +
        `// or: import { applyFilter } from '@aufbau/filters';\n\n` +
        `applyFilter('#logo', '${current.id}', ${opts});`;
    }

    const camel = s => s.replace(/-([a-z])/g, (_, c) => c.toUpperCase());

    select(current);
  </script>
</body>
</html>
