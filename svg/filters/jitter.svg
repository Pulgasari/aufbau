<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">
  <defs>
    <filter id="aufbau-filter-jitter">
      <feTurbulence type="turbulence" baseFrequency="var(--aufbau-filter-frequency, 0.5)" numOctaves="1" seed="1" result="noise">
        <animate attributeName="seed" values="1;3;5;7;9;11;13;15" dur="0.6s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="var(--aufbau-filter-amount, 5)" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
