<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">
  <defs>
    <filter id="aufbau-filter-grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="var(--aufbau-filter-frequency, 0.8)"
        numOctaves="var(--aufbau-filter-octaves, 2)"
        stitchTiles="stitch"
        result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="var(--aufbau-filter-opacity, 0.15)"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
</svg>
