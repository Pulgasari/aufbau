<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">
  <defs>
    <pattern id="aufbau-pattern-checks" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="20" height="20" fill="var(--aufbau-pattern-bg, transparent)"/>
      <rect width="10" height="10" fill="var(--aufbau-pattern-fg, #000000)"/>
      <rect x="10" y="10" width="10" height="10" fill="var(--aufbau-pattern-fg, #000000)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#aufbau-pattern-checks)"/>
</svg>
