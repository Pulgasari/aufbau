<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">
  <defs>
    <pattern 
      id="aufbau-pattern-stripes" 
      width="20" height="20" 
      patternUnits="userSpaceOnUse" 
      patternTransform="rotate(var(--svg-rotate))"
      >
      <rect width="20" height="20" fill="var(--svg-bg)"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="var(--svg-fg)" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#aufbau-pattern-stripes)"/>
</svg>
