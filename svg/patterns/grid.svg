<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">
  <defs>
    <pattern 
      id="aufbau-pattern-grid" 
      width="20" height="20" 
      patternUnits="userSpaceOnUse" 
      patternTransform="rotate(var(--svg-rotate))"
      >
      <rect width="20" height="20" fill="var(--svg-bg)"/>
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--svg-fg)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#aufbau-pattern-grid)"/>
</svg>
