<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>docs</title>
  <!-- aufbau -->
  <script src="https://pulgasari.github.io/aufbau/boot.js" data-splash></script>
  <script src="https://pulgasari.github.io/importmap.js"></script>
  <link rel="stylesheet" href="https://pulgasari.github.io/aufbau/builders/docs/index.aufbau.css" />
  <!-- google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

<body class='mobilefix'>
<div id='app'></div>
  
<script type='module'>
import { createDocsFW, html } from '@aufbau/builders/docs';

globalThis.navigator?.serviceWorker?.register(
  new URL('./sw.js', import.meta.url), { type: 'module' }
).catch(console.error);

/*
if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
  navigator.serviceWorker
    .register(new URL('./sw.js', import.meta.url), { type: 'module' })
    .catch(err => console.error('[SW Error]:', err));
}
*/

function VersionBanner() {
  return html`
    <div class="version-banner">
      <span>Version 2026.1 Active</span>
    </div>
  `;
}

createDocsFW({
  index  : '$repo/readme.md',
  target : '#app',
  brand: {
    svg   : '$repo/logo.svg',
    title : 'aufbau'
  },
  
  vars: {
    repo  : '../',
  },
  
  sidebar: {
    docs       : '$repo/readme.md',
    elements   : '$repo/elements/readme.md',
    kits       : '$repo/kits/readme.md',
    packages   : 'packages.md',
    resources  : 'resources.md',
  },

  footerText : 'aufbau | 2026',
  before     : VersionBanner,
  after      : '<p class="content-feedback">Found an issue? Edit this page on GitHub.</p>'       
});
</script>
  
</body>
</html>
