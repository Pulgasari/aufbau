<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>docs</title>
  <!-- aufbau -->
  <script>
    const search = globalThis.location?.search ?? '';
    globalThis.DEBUG = new URLSearchParams(search).has('debug');
    console.log('DEBUG:', DEBUG);
  </script>
  <script src="https://code.pulgasari.dev/importmap.js"></script>
  <link rel="stylesheet" href="https://pulgasari.github.io/aufbau/builders/docs/index.aufbau.css" />
  <!-- google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

<body class='mobilefix'>
<div id='app'></div>
  
<script type='module'>
import { createDocsFW, html } from '@aufbau/builders/docs';

createDocsFW({
  sw     : new URL('./sw.js', import.meta.url),
  index  : '$repo/readme.md',
  target : '#app',
  brand: {
    svg   : '$repo/logo.svg',
    title : 'aufbau'
  },
  
  vars: {
    repo  : '../',
  },
  
  sidebar: {
    docs       : '$repo/readme.md',
    elements   : '$repo/elements/readme.md',
    kits       : '$repo/kits/readme.md',
    packages   : 'packages.md',
    resources  : 'resources.md',
  },

  footerText : 'aufbau | 2026',
  // after, before       
});
</script>
  
</body>
</html>
