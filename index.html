<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aufbau</title>
  <link rel="stylesheet" href="./index.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hubot+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet" />
  <script type="importmap">
  {
    "imports": {
      "preact"             : "https://esm.sh/preact@10.20.1",
      "preact/hooks"       : "https://esm.sh/preact@10.20.1/hooks",
      "@preact/signals"    : "https://esm.sh/@preact/signals@1.2.2?external=preact",
      "htm"                : "https://esm.sh/htm@3.1.1",
      "@aufbau/cache"      : "./cache/index.js",
      "@aufbau/import"     : "./import/index.js",
      "@aufbau/kit"        : "./kit/index.js",
      "@aufbau/shaders"    : "./shaders/index.js",
      "@aufbau/stylesheet" : "./stylesheet/index.js"
    }
  }
  </script>
</head>

<body class="mobilefix">

  <header>
    <nav>
      <a href="#">About</a>
      <a href="#">Docs</a>
      <a href="#">Examples</a>
      <a href="#">@GitHub</a>
    </nav>
  </header>
  
  <div id="welcome">
    <div id="logo" data-animate="vibrate">
      <div class="sub">version: 0.1.0</div>
    </div>
  </div>

  <footer>
    <div>
      ...
    </div>
  </footer>

  <script type="module">
    import aufbau from './kit/index.js';
    function Test () {
      return html`<div>moin!</div>`;
    }
    aufbau.render(html`<${Test} />`, document.querySelector('footer div'));
    const { define, update, signal, effect } = aufbau;
    alert('aufbau!');

    // Register custom CSS custom properties
    define({ key: 'bg', type: 'property' });
    define({ key: 'fg', type: 'property' });

    const colors = [
      { bg: 'white', fg: 'black' },
      { bg: 'red',   fg: 'black' },
      { bg: 'red',   fg: 'white' },
      { bg: 'black', fg: 'white' },
      { bg: 'black', fg: 'red'   },
      { bg: 'white', fg: 'red'   },
    ];

    const indexSignal = signal(0);

    // Reactively update theme variables via signal effect
    effect(() => {
      const { bg, fg } = colors[indexSignal.value];
      update({ key: 'bg', value: bg });
      update({ key: 'fg', value: fg });
    });

    setInterval(() => {
      indexSignal.value = (indexSignal.value + 1) % colors.length;
    }, 1000);
  </script>

</body>
</html>
