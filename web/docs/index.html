<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>aufbau docs</title>
  <script src="https://code.pulgasari.dev/importmap.js"></script>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { createDocsFW } from '@aufbau/builders/docs';

    // aufbau.dev serves web/ only, the markdown of the repo comes from where the
    // packages are published
    createDocsFW({
      index  : '$repo/readme.md',
      target : '#app',
      brand  : { svg: '$repo/logo.svg', title: 'aufbau' },
      vars   : { repo: 'https://code.pulgasari.dev/aufbau/' },

      sidebar: {
        docs      : '$repo/readme.md',
        packages  : 'packages.md',
        resources : 'resources.md',
      },
    });
  </script>
</body>
</html>
