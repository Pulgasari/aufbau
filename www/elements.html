<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>@aufbau/elements</title>
  <script src="https://code.pulgasari.dev/importmap.js"></script>
  <!--<link rel="stylesheet" href="./demo.css"/>-->
  <style>
    main, #form { margin: 0; padding: 0; }
    #form   { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; padding: 0; }
    #form > section { border-radius: 0; --pad: normal; scroll-margin-top: 1rem; }
    #form > section:nth-child(odd) { --bg: var(--zebra); }

    h1, h2, h3, h4, h5, h6 { font-weight: 600; --fg: --muted(50%); }
    h1 { --bg: --alpha(ink, 0.2); --pad: big; text-align: center; text-transform: uppercase; }

    small { --fg: --muted(0.5); }
    /*
    small { --fg: --color(fg, muted, 0.5); }
    small { color: --muted(0.5); }
    small { color: --color(fg, muted, 0.5); }
    */


    /* one variant per row: what it is on the left, the element on the right */
    .row { 
      display: grid; grid-template-columns : 12rem minmax(0, 1fr);
      align-items: center; --gap: normal;
      > span { --fg: --muted(); font-size: .8rem; font-family: ui-monospace, monospace; }

      /* inline controls keep their own width, fields take the row */
      > :is(input-bool, btn-push, btn-tap, btn-icon, output-value, aufbau-skeleton[shape="circle"]) { justify-self: start; }
    }
    .line { display: flex; flex-wrap: wrap; --gap: small; align-items: center; }

    /* :::::: ASIDE: filter + toc */

    aside data-filter { display: block; margin-bottom: .75rem; }
    aside nav-toc {
      ol     { list-style: none; }
      a      { display: block; --pad: small; color: inherit; text-decoration: none; }
      a:hover         { --bg: var(--panel); }
      a[aria-current] { --bg: --color(ink); --fg: --color(bg); }
    }

    /* :::::: ELEMENTS */

    .flags          { display: grid; grid-template-columns: repeat(auto-fill, minmax(7rem, 1fr)); --gap: small; }
    .flags figure   { display: grid; justify-items: center; --gap: tiny; font-size: .75rem; color: --muted(); }
    .flags svg-flag { width: 2.5rem; }

    #table-demo td:first-child { white-space: nowrap; }

    #index data-item {
      display         : grid;
      place-items     : center;
      aspect-ratio    : 1;
      background      : color-mix(in oklch, var(--color-ink) calc(var(--mix) * 1%), var(--color-bg));
      --fg            : var(--color-fg);
      font-weight     : 600;
    }
    #index data-index[viewmode="list"] data-item { aspect-ratio: auto; --pad: normal; place-items: start; }

    #loop aufbau-loop[mode="carousel"] { 
      block-size: 8rem; border: 1px;
      > div { display: grid; place-items: center; font-size: 1.5rem; font-weight: 700; }
    }
    #loop aufbau-loop[mode="marquee"] span { padding-inline: 1.5rem; font-family: ui-monospace, monospace; }

    #keyboard textarea {
      width: 100%; min-height: 4rem; --pad: small;
      border: 1px;
      background: var(--panel); color: inherit; font: inherit;
    }

    #div is(div-x, div-y) { 
      border: 1px; --gap: small; --pad: small; 
      > span { --bg: var(--panel); --pad: tiny; }
    }

    #skeleton data-item { display: grid; grid-template-columns: 3rem 1fr; --gap: small; --pad: small; align-items: center; border: 1px;  }
    #skeleton .avatar   { width: 3rem; aspect-ratio: 1; border-radius: 50%; --bg: --color(ink); }

    media-video, media-audio, media-file { max-width: 32rem; }

    @media (width < 48rem) {
      .row     { grid-template-columns: minmax(0, 1fr); --gap: tiny; }
      section  { padding: 1rem; }
    }
  </style>
</head>
<body>

  <!-- Visual progress bar placed under the scrollbar area -->
<div class="scroll-progress-track">
  <div class="scroll-progress-fill"></div>
</div>

<htx-part src='./dock.htx.html'></htx-part>


<!--
  <aside>
    <h1>@aufbau/elements</h1>
    <p>every element with its types and looks. the aside is a data-filter over a nav-toc.</p>
    <data-filter target="#toc li" placeholder="filter elements…"></data-filter>
    <nav-toc id="toc" target="main" selector="h2"></nav-toc>
  </aside>
-->
  
  
<main>
<form id="form"><!-- the whole page is one form: every named control lands in getFormValues() at the end -->
<!--|::: APP    :::|--><h1>app-</h1>    <htx-part src='./elements.app.htx.html'></htx-part>
<!--|::: BTN    :::|--><h1>btn-</h1>    <htx-part src='./elements.btn.htx.html'></htx-part>
<!--|::: DATA   :::|--><h1>data-</h1>   <htx-part src='./elements.data.htx.html'></htx-part>
<!--|::: DIV    :::|--><h1>div-</h1>    <htx-part src='./elements.div.htx.html'></htx-part>
<!--|::: EMBED  :::|--><h1>embed-</h1>  <htx-part src='./elements.embed.htx.html'></htx-part>
<!--|::: INPUT  :::|--><h1>input-</h1>  <htx-part src='./elements.input.htx.html'></htx-part>
<!--|::: MEDIA  :::|--><h1>media-</h1>  <htx-part src='./elements.media.htx.html'></htx-part>
<!--|::: MOCK   :::|--><h1>mock-</h1>   <htx-part src='./elements.mock.htx.html'></htx-part>
<!--|::: NAV    :::|--><h1>nav-</h1>    <htx-part src='./elements.nav.htx.html'></htx-part>
<!--|::: OUTPUT :::|--><h1>output-</h1> <htx-part src='./elements.output.htx.html'></htx-part>
<!--|::: POP    :::|--><h1>pop-</h1>    <htx-part src='./elements.pop.htx.html'></htx-part>
<!--|::: SVG    :::|--><h1>svg-</h1>    <htx-part src='./elements.svg.htx.html'></htx-part>
<!--|::: WRITE  :::|--><h1>write-</h1>  <htx-part src='./elements.write.htx.html'></htx-part>

    <!-- :::::: FORM :::::: -->

    <section id="form-values">
      <h2>getFormValues()</h2>
      <p class="hint">every named control of this page sits in one form. the values below update on every change.</p>
      <div class="line">
        <btn-push type="submit" variant="primary">submit, checks validity</btn-push>
        <btn-push type="reset">reset</btn-push>
      </div>
      <write-code id="form-dump" lang="json" actions="copy"></write-code>
    </section>

    <!-- :::::: AUFBAU :::::: -->
    <htx-part src='./elements.aufbau.htx.html'></htx-part>

  </form>
  </main>

  <script type="module">
    import aufbau        from '@aufbau/api';
    import getFormValues from '@domina/methods/getFormValues.js';
    import { settled }   from '@htx/elements';

    // the sections of the form come from elements.<namespace>.htx.html, through
    // <htx-part>. everything below reads them by id, so they have to be in first
    await settled();

    await aufbau.boot();
    if (new URLSearchParams(location.search).has('dev')) await import('@aufbau/devtools/boot.js');

    const { gestalt } = aufbau;
    const $ = id => document.getElementById(id);
  
    import { htx, render } from '@htx/preact';
    loadStylesheet('./demo.css');
/*
    function Dock () {
      return htx`
        <div>
          <btn-icon icon='search'></btn-icon>
        </div>
        <div>
          <btn-icon icon='search'></btn-icon>
          <btn-icon icon='search'></btn-icon>
          <btn-icon icon='search'></btn-icon>
          <btn-icon icon='search'></btn-icon>
        </div>
        <div>
          <btn-icon icon='search'></btn-icon>
        </div>
      `;
    }

    render(htx`<${Dock}/>`, document.getElementById('dock'));
*/
    // :::::: TOASTS
    // every [data-toast] on the page, buttons and menu entries alike

    await aufbau.elements.load('pop-toast');
    const Toast = customElements.get('pop-toast');
    const toast = (message, type = 'info') => Toast.notify({ message, type });

    document.addEventListener('click', event => {
      const source = event.target.closest('[data-toast]');
      if (source) toast(source.dataset.toast, source.dataset.type);
    });

    // :::::: GESTALT
    // the theme picker, the look segments, the mode cycle, the dark switch and
    // the swatch all go through one function, the code block shows the result

    const themes = await gestalt.themes();

    async function setGestalt (values) {
      await gestalt.set(values);
      $('gestalt-code').setAttribute('code', JSON.stringify({ ...gestalt.get(), colors: gestalt.colors() }, null, 2));
    }

    $('theme-picker').append(...themes.map(name => Object.assign(document.createElement('input-option'), { textContent: name })));
    $('theme-picker').setAttribute('value', gestalt.get('theme'));

    const onChange = (id, handler) => $(id).addEventListener('change', event => handler(event.currentTarget));

    onChange('theme-picker', picker => picker.value && setGestalt({ theme: picker.value }));
    onChange('look-picker',  picker => setGestalt({ look: picker.value }));
    onChange('mode-picker',  picker => { setGestalt({ mode: picker.value }); $('dark-toggle').checked = picker.value === 'dark'; });
    onChange('dark-toggle',  toggle => { setGestalt({ mode: toggle.checked ? 'dark' : 'light' }); $('mode-picker').value = toggle.checked ? 'dark' : 'light'; });

    // a color is a theme too, themes.css derives bg and fg from it and the mode decides which way
    $('theme-swatch').addEventListener('input', event => setGestalt({ theme: event.currentTarget.value }));

    $('random-theme').addEventListener('click', () => {
      const theme = themes[Math.floor(Math.random() * themes.length)];
      $('theme-picker').value = theme;
      setGestalt({ theme });
    });

    $('dark-toggle').checked = matchMedia('(prefers-color-scheme: dark)').matches;
    setGestalt({});

    onChange('font-size', input => { document.body.style.fontSize = `${input.value}px`; });

    // :::::: CONFIG

    $('config-demo').spec = {
      title   : { type: 'text', default: 'aufbau' },
      size    : { type: 'number', min: 8, max: 32, default: 14, unit: 'px' },
      speed   : { type: 'duration', min: '0s', max: '5s', step: '0.1s', default: '1s' },
      accent  : { type: 'color', default: '#ff79c6' },
      density : { values: ['compact', 'cozy', 'touch'], look: 'segments', default: 'cozy' },
      sound   : { type: 'boolean', default: true },
    };
    $('config-demo').addEventListener('config', event => toast(`${event.detail.key}: ${event.detail.values[event.detail.key]}`));

    // :::::: DATA-LIST, DATA-TABLE
    // both read the elements of this page, from the section headings

    const tags = [...document.querySelectorAll('main h2')].flatMap(heading => heading.textContent.split('·').map(tag => tag.trim())).filter(tag => tag.includes('-'));

    $('element-names').append(...tags.map(tag => Object.assign(document.createElement('option'), { value: tag })));

    $('table-demo').data = tags.map(tag => {
      const Element = customElements.get(tag);
      const schema  = Element?.attr ?? {};
      return {
        element : tag,
        control : Boolean(Element?.formAssociated),
        looks   : schema.look?.values?.join(', ') ?? schema.type?.values?.join(', ') ?? '',
      };
    });

    // :::::: CRUMBS, INDEX, KEYBOARD, MENU

    document.addEventListener('nav-crumbs', event => toast(`crumb: ${event.detail.path}`));

    onChange('menu-placement',  picker => $('menu-demo').setAttribute('placement', picker.value));
    onChange('index-viewmode',  picker => $('index-demo').setAttribute('viewmode',  picker.value));
    $('index-size').addEventListener('input', event => $('index-demo').setAttribute('item-size', `${event.currentTarget.value}px`));
    onChange('keyboard-layout', picker => $('keyboard-demo').setAttribute('layout', picker.value));

    // :::::: FLAGS

    const regions = new Intl.DisplayNames(['en'], { type: 'region' });
    $('flag-list').append(...['at', 'br', 'ch', 'de', 'es', 'fr', 'gb', 'in', 'it', 'jp', 'ke', 'mx', 'nl', 'no', 'pl', 'se', 'ua', 'us'].map(code => {
      const figure = document.createElement('figure');
      figure.innerHTML = `<svg-flag code="${code}"></svg-flag><figcaption>${regions.of(code.toUpperCase())}</figcaption>`;
      return figure;
    }));

    // :::::: LOOP

    const words = tags.map(tag => Object.assign(document.createElement('span'), { textContent: tag }));
    $('marquee').append(...words);
    $('marquee-right').append(...words.map(word => word.cloneNode(true)));

    // :::::: MODAL, PROMPT

    $('modal-open').addEventListener('click', async () => {
      const answer = await $('modal-demo').show();
      toast(`the modal closed with: ${answer || 'nothing'}`);
    });
    $('modal-demo').addEventListener('click', event => {
      const button = event.target.closest('[data-close]');
      if (button) $('modal-demo').close(button.dataset.close);
    });

    await aufbau.elements.load('pop-prompt');
    const Prompt = customElements.get('pop-prompt');

    $('prompt-confirm').addEventListener('click', async () => toast(`confirmed: ${await Prompt.confirm('delete it?', { heading: 'delete', confirm: 'delete' })}`));
    $('prompt-text').addEventListener('click',    async () => toast(`named: ${await Prompt.prompt('what is it called?', 'untitled')}`));
    $('prompt-date').addEventListener('click',    async () => toast(`when: ${await Prompt.prompt('when?', '', { field: 'date' })}`));
    $('prompt-alert').addEventListener('click',   () => Prompt.alert('saved.'));

    // :::::: OPTIONS

    let added = 0;
    $('option-add').addEventListener('click', () => {
      const option = document.createElement('input-option');
      option.setAttribute('value', `new-${++added}`);
      option.textContent = `new ${added}`;
      $('option-picker').append(option);
    });
    $('option-drop').addEventListener('click', () => [...$('option-picker').querySelectorAll('input-option')].pop()?.remove());

    // :::::: PROGRESS, SKELETON

    $('progress-value').addEventListener('input', event => $('progress-demo').setAttribute('value', event.currentTarget.value));
    onChange('skeleton-toggle', toggle => $('skeleton-card').toggleAttribute('skeleton', toggle.checked));

    // :::::: TREE

    $('tree-nodes').nodes = [
      { label: 'elements', icon: 'lucide:folder', expanded: true, children: tags.slice(0, 6).map(tag => ({ label: `${tag}.js`, icon: 'lucide:file-code', value: tag })) },
      { label: 'more', icon: 'lucide:folder', children: tags.slice(6).map(tag => ({ label: `${tag}.js`, icon: 'lucide:file-code', value: tag })) },
    ];
    document.addEventListener('data-tree-select', event => event.detail?.value && toast(`selected: ${event.detail.value}`));

    // :::::: WAVE

    const peaks = Array.from({ length: 64 }, (_, index) => (.35 + .65 * Math.abs(Math.sin(index * .37) * Math.cos(index * .11))).toFixed(2));
    for (const id of ['wave-demo', 'wave-range']) $(id).setAttribute('peaks', peaks.join(' '));
    $('wave-demo').addEventListener('media-wave-seek', event => $('wave-demo').setAttribute('progress', event.detail.progress));

    // :::::: FORM

    const form = $('form');
    const dump = () => $('form-dump').setAttribute('code', JSON.stringify(getFormValues(form), null, 2));

    let pending = false;
    const scheduleDump = () => { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; dump(); }); } };

    form.addEventListener('input',  scheduleDump);
    form.addEventListener('change', scheduleDump);
    form.addEventListener('reset',  () => setTimeout(dump));
    form.addEventListener('submit', event => {
      event.preventDefault();
      form.reportValidity() ? toast('the form is valid', 'success') : toast('the form is not valid yet', 'warning');
      dump();
    });

    dump();


    /**
 * Appends a stylesheet link element to document head with cache busting.
 * 
 * @param {string} href - The URL of the CSS file.
 * @param {Object} [options] - Optional settings.
 * @param {string} [options.id] - ID attribute for the link tag.
 * @param {string|number} [options.version] - Custom version parameter (defaults to timestamp).
 * @returns {Promise<HTMLLinkElement>} Resolves when the CSS file is loaded.
 */
function loadStylesheet(href, options = {}) {
  return new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.type = 'text/css';

    if (options.id) {
      link.id = options.id;
    }

    // Determine cache-busting param (uses Date.now() if no version is provided)
    const version = options.version ?? Date.now();
    const separator = href.includes('?') ? '&' : '?';
    
    link.href = `${href}${separator}v=${encodeURIComponent(version)}`;

    link.onload = () => resolve(link);
    link.onerror = () => reject(new Error(`Failed to load stylesheet: ${href}`));

    document.head.appendChild(link);
  });
}

  </script>
</body>
</html>
