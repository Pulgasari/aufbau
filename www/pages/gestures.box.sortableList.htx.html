<script>
  import { sortable }     from '@aufbau/gestures';
  import { log, mounted } from './gestures.shared.js';

  const setup = mounted(list => sortable(list, {
    onSort: ({ from, to, order }) => log(`sorted ${from} → ${to}: ${order.map(item => item.textContent).join(' ')}`),
  }));
</script>

<style>
  .sort-list { display: grid; gap: .4rem; list-style: none; margin: 0; padding: 0; }
  .sort-list li {
    background    : color-mix(in oklch, currentColor 6%, transparent);
    border        : 1px solid color-mix(in oklch, currentColor 20%, transparent);
    border-radius : .6rem;
    padding       : .75rem 1rem;
    transition    : box-shadow .15s, scale .15s;

    &[data-lifted]   { box-shadow: 0 .4rem 1rem #0005; scale: 1.03; }
    &[data-dragging] { background: color-mix(in oklch, var(--color-ink) 25%, transparent); box-shadow: 0 .6rem 1.5rem #0007; }
  }
</style>

<div>
  <h2>sortable · list</h2>
  <p>touch and pen: hold, then drag. mouse: drag at once. keys: alt + arrows.</p>
  <ul class="sort-list" ref=${setup}><li>eins</li><li>zwei</li><li>drei</li><li>vier</li><li>fünf</li></ul>
</div>
