<script>
  import gestures    from '@aufbau/gestures';
  import { pressed } from './gestures.shared.js';

  // the script is the body of the component and runs before its markup exists,
  // so the elements come through ref, each one as soon as it is built
  let output;

  const stepper = button => {
    const step = () => { output.value = Number(output.value) + Number(button.dataset.step); };
    gestures(button, {
      ...pressed(button),
      onPressRepeat : step,
      onPressStart  : () => { button.classList.add('pressed'); step(); },
    });
  };
</script>

<style>
  .gestures .pad.stepper {
    align-items     : center;
    display         : flex;
    gap             : 1rem;
    justify-content : center;
    padding         : 1rem;

    button {
      aspect-ratio  : 1;
      border-radius : 50%;
    }

    output { font: 700 2rem/1 ui-monospace, monospace; min-inline-size: 4ch; text-align: center; }
  }
</style>

<div>

  <h2>pressRepeat</h2>
  <p>a stepper: one step on contact (<code>pressStart</code>), then repeating while held.</p>

  <div class="pad stepper">
    <button type="button" data-step="-1" ref=${stepper}>−</button>
    <output ref=${node => output = node}>0</output>
    <button type="button" data-step="1" ref=${stepper}>+</button>
  </div>

</div>
