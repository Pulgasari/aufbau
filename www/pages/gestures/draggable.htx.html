<script>
  import { draggable }    from '@aufbau/gestures';
  import { log, mounted } from './../gestures.shared.js';

  // the pink chips go into the slot or back, the blue one is free
  const setup = mounted(yard => {
    for (const chip of yard.querySelectorAll('.chip[data-kind="slot"]')) {
      draggable(chip, {
        bounds  : 'parent',
        drop    : '.slot',
        onDrop  : ({ target }) => { 
          target.replaceChildren(chip); 
          chip.style.translate = ''; 
          log(`dropped chip ${chip.textContent}`); 
        },
        onEnter : () => log('over the slot'),
        revert  : true,
      });
    }

    draggable(yard.querySelector('.chip.free'), {
      bounds : 'parent',
      grid   : 40,
      onEnd  : ({ position }) => log(`free chip at ${position.x}, ${position.y}`),
    });
  });
</script>

<style>
  .yard { 
    align-items: flex-start; 
    border: 1px dashed color-mix(in oklch, currentColor 20%, transparent); 
    border-radius: .75rem; 
    display: flex; 
    flex-wrap: wrap; 
    gap: .75rem; 
    min-block-size: 14rem; 
    padding: .75rem; 
    position: relative; 
  }
  .yard .chip {
    aspect-ratio  : 1;
    background    : var(--color-ink);
    border-radius : .75rem;
    color         : #000;
    cursor        : grab;
    display       : grid;
    font-weight   : 700;
    inline-size   : 3.5rem;
    place-items   : center;

    &.free           { background: #8be9fd; }
    &[data-dragging] { box-shadow: 0 .5rem 1.5rem #0006; cursor: grabbing; z-index: 2; }
  }
  .yard .slot {
    aspect-ratio  : 1;
    border        : 2px dashed color-mix(in oklch, currentColor 20%, transparent);
    display       : grid;
    font-size     : .75rem;
    inline-size   : 5rem;
    margin-inline-start : auto;
    opacity       : .8;
    place-items   : center;

    &[data-drop-over] { 
      background: color-mix(in oklch, var(--color-ink) 20%, transparent); 
      border-color: var(--color-ink); 
    }
    .chip { cursor: default; }
  }
</style>

<div>
  <h2>draggable</h2>
  <p>
    the pink chips go into the slot or back. 
    the blue one is free: bounds, a flick glides on, snaps to a 40 px grid. 
    keys: arrows.
  </p>
  <div class="yard" ref=${setup}>
    <div class="chip" data-kind="slot">1</div>
    <div class="chip" data-kind="slot">2</div>
    <div class="chip free">~</div>
    <div class="slot">drop here</div>
  </div>
</div>
