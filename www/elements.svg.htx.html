<!-- elements.svg.htx.html: the svg- elements of elements.html -->

<section id="flag">
  <h2>svg-flag</h2>
  <div class="row">
    <span>variant</span>
    <div class="line">
      <svg-flag code="de" variant="circle"></svg-flag>
      <svg-flag code="de" variant="square"></svg-flag>
      <svg-flag code="de" variant="4x3"></svg-flag>
    </div></div>
  <div class="flags" id="flag-list"></div>
</section>

<section id="icon">
  <h2>svg-icon</h2>
  <div class="row"><span>mode="mask"</span>
    <div class="line">
      <svg-icon icon="lucide:house"></svg-icon>
      <svg-icon icon="lucide:search"></svg-icon>
      <svg-icon icon="lucide:settings"></svg-icon>
      <svg-icon icon="save"></svg-icon>
      <small>the last one is an alias</small>
    </div></div>
  <div class="row"><span>prefix aufbau</span>
    <div class="line">
      <svg-icon icon="aufbau:aufbau" size="2rem"></svg-icon>
      <small>@aufbau/svg/icons/aufbau.svg</small>
    </div></div>
  <div class="row"><span>size, color</span>
    <div class="line">
      <svg-icon icon="lucide:heart" size="1rem"></svg-icon>
      <svg-icon icon="lucide:heart" size="2rem" color="var(--color-ink)"></svg-icon>
      <svg-icon icon="lucide:heart" size="3rem" color="var(--color-ink)"></svg-icon>
    </div></div>
  <div class="row"><span>mode="image"</span>
    <div class="line">
      <svg-icon icon="logos:javascript" mode="image" size="2rem"></svg-icon>
      <svg-icon icon="logos:css-3"      mode="image" size="2rem"></svg-icon>
      <svg-icon icon="logos:html-5"     mode="image" size="2rem"></svg-icon>
    </div></div>
</section>

<section id="logo">
  <h2>svg-logo</h2>
  <div class="row"><span>logo</span>
    <div class="line">
      <svg-logo logo="aufbau"></svg-logo>
      <svg-logo logo="domina"></svg-logo>
      <svg-logo logo="ratscript"></svg-logo>
      <svg-logo logo="zugriff"></svg-logo>
    </div></div>
  <div class="row"><span>size</span>
    <div class="line">
      <svg-logo logo="poo"       size="2rem"></svg-logo>
      <svg-logo logo="skullface" size="3rem"></svg-logo>
    </div></div>
</section>
