<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>@aufbau/patterns</title>
  <script src="https://code.pulgasari.dev/importmap.js"></script>
  <link rel="stylesheet" href="./demo.css"/>
  <style>
    .stage { background-color: #f4f5f7; background-repeat: repeat; }
  </style>
</head>
<body>

  <aside>
    <h1>@aufbau/patterns</h1>
    <p>patterns are js functions that generate svg. pick one and tweak it live.</p>
    <nav class="list" id="list"></nav>
  </aside>

  <main>
    <div class="stage" id="stage"></div>
    <h2 id="title"></h2>
    <div class="controls" id="controls"></div>
    <div class="panels">
      <aufbau-code id="svg" lang="svg"></aufbau-code>
      <aufbau-code id="css" lang="css"></aufbau-code>
      <aufbau-code id="js"  lang="js"></aufbau-code>
    </div>
  </main>

  <script type="module">
    import aufbau from '@aufbau/api';
    import { list, patternImage, patternSvg } from '@aufbau/patterns';
    import { render as renderControls } from '@aufbau/gui';

    await aufbau.boot();

    const $ = id => document.getElementById(id);

    const catalogue   = list();
    const defaultsOf  = pattern => Object.fromEntries(Object.entries(pattern.vars).map(([key, spec]) => [key, spec.default]));
    const optionsCode = options => JSON.stringify(options, null, 2).replace(/"([^"]+)":/g, '$1:');

    let current = null;
    let options = {};

    for (const pattern of catalogue) {
      const button = Object.assign(document.createElement('button'), { textContent: pattern.name, onclick: () => select(pattern) });
      button.dataset.id = pattern.id;
      $('list').append(button);
    }

    function select (pattern) {
      current = pattern;
      options = defaultsOf(pattern);
      for (const button of $('list').children) button.setAttribute('aria-current', String(button.dataset.id === pattern.id));

      $('title').textContent = `${pattern.name}  ·  ${pattern.id}`;
      $('controls').replaceChildren(renderControls(pattern.vars, { values: options, onChange: values => { options = values; render(); } }));
      render();
    }

    async function render () {
      const image = await patternImage(current.id, options);
      $('stage').style.backgroundImage = image;

      $('svg').setAttribute('code', await patternSvg(current.id, options));
      $('css').setAttribute('code', `.box {\n  background-image: ${image};\n  background-repeat: repeat;\n}`);
      $('js').setAttribute('code',
        `import { apply } from '@aufbau/patterns';\n\n` +
        `await apply('.box', '${current.id}', ${optionsCode(options)});`);
    }

    select(catalogue[0]);
  </script>
</body>
</html>
